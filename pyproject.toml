[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unifi-fabric-mcp-server"
version = "0.7.1"
description = "MCP server for UniFi Fabric: Network, Protect, Site Manager, InnerSpace, Carrier Fabric, Mobility."
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "SWK Studios" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "unifi", "ubiquiti", "network", "protect", "site-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cachetools>=5.3",
    "fastmcp>=4.1.1,<5.0",
    "httpx>=0.27",
    # Imported directly (JWKS download cap); the supported release has decoders that
    # yield bounded chunks, which the decoded-size cap relies on; requirements.lock pins
    # the tested release.
    "httpx2>=2.13.1",
    "pydantic>=2.0",
    # The Code Mode sandbox (UNIFI_TOOL_MODE=codemode, opt-in and experimental): imported
    # only when a script runs, so the default modes never start a worker.
    "pydantic-monty>=1.4,<2",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    # The sdist test invokes the same pinned backend as the build stage; editables is
    # hatchling's editable-build dependency for --no-build-isolation -e installs.
    "editables==0.6",
    "hatchling==1.33.0",
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # Parallel test runs (CI: -n 4 --dist loadgroup, one job); coverage combines across workers.
    "pytest-xdist>=3.8",
    "ruff>=0.4",
    "respx>=0.21",
    "mypy>=1.10",
    "types-cachetools>=5.3",
    # In-memory CA/cert generation for the real-socket TLS tests (test_tls_socket.py).
    "trustme>=1.1",
    # The br case of the JWKS decoded-size cap test (httpx2 decodes br only with it).
    "brotli>=1.1",
]

[project.scripts]
unifi-fabric-mcp = "unifi_fabric.entrypoint:main"
unifi-fabric-mcp-server = "unifi_fabric.entrypoint:main"

[project.urls]
Homepage = "https://github.com/swkstudios/unifi-fabric-mcp-server"
Repository = "https://github.com/swkstudios/unifi-fabric-mcp-server"
Issues = "https://github.com/swkstudios/unifi-fabric-mcp-server/issues"
Changelog = "https://github.com/swkstudios/unifi-fabric-mcp-server/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
only-include = ["src/unifi_fabric", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_fabric"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "S", "ANN", "UP"]
ignore = [
    # ANN001/ANN201/ANN202: pervasive in existing tool helpers; annotating
    # incrementally — mypy is added to CI as the primary type-checking gate.
    "ANN001",
    "ANN201",
    "ANN202",
    # ANN401: `Any` is legitimately required for **fields/**extra pass-through
    # kwargs and for coroutine wrappers that must accept arbitrary return types.
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"src/unifi_fabric/tools/protect.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/network_services_proxy.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/firewall_proxy.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/network.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/recognition.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/site_manager.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/carrier_fabric.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/innerspace.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/mobility.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/placement_snapshot.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"src/unifi_fabric/tools/connector.py" = ["E501"]  # wrappers moved from server.py keep their docstrings
"docs/**/test_*.py" = ["S101", "S105", "S106", "S110", "B017", "ANN"]
"scripts/**" = [
    "S603",  # subprocess calls are intentional git invocations
    "S607",  # partial executable path (git) is intentional
    "S310",  # urllib.request.urlopen with a known GitHub API URL is intentional
    "ANN",   # type annotations not required on standalone scripts
]
"tests/**" = [
    "S101",  # assert is idiomatic in pytest
    "S105",  # hardcoded "password" strings in test fixtures are not secrets
    "S106",  # `page_token` / `acct_server_secret` in test args are not secrets
    "S110",  # try-except-pass in teardown/cleanup helpers is intentional
    "B017",  # broad pytest.raises(Exception) acceptable in unit tests
    "ANN",   # type annotations not required on test functions
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not mutating and not slow'"
markers = [
    "tls: real-socket HTTPS/TLS tests (in-memory CA, 127.0.0.1 only). Run in CI by default — NOT a runtime skip, so the wrong-CA reject assertion always executes.",
    "integration: live-console integration test. Reads real credentials from the environment (opts out of the hermetic-env fixture) and is skipped unless UNIFI_API_KEY is set.",
    "mutating: performs a LIVE write or physical actuation against the production UniFi console (config change, or device actuation such as a PTZ move or a talkback/speaker session). A superset-label on top of `integration`; deselected by default; explicit `-m mutating` and UNIFI_TEST_ALLOW_MUTATIONS=1 are required.",
    "slow: a long property run (the 210,000-case secret-scrubber oracle check). Selected explicitly with `-m slow`.",
]

[tool.coverage.run]
# Server reload tests run in disposable interpreters; combine their measurements.
patch = ["subprocess"]
source = ["src/unifi_fabric"]
# Measure through sys.monitoring (PEP 669): a line is reported once and its event is then
# disabled, so hot loops (the secret scrubber on escape-dense error bodies) run at
# untraced speed instead of paying a C-tracer callback per executed line, about 3x on
# those tests. Line coverage is the same; this suite measures lines only (no branch).
core = "sysmon"
# Store paths relative to the checkout so per-worker data files combine into one report.
relative_files = true

[tool.coverage.report]
show_missing = true
# Defensive branches guarded by `# pragma: no cover` are excluded from the count.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
